name: Daily 10:30 Tender Radar Update

on:
  schedule:
    # 02:30 UTC = 10:30 Asia/Taipei (UTC+8)
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tenders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch daily service-only tenders
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TZ=Asia/Taipei python3 scripts/fetch_daily_api.py --out-dir data --max-details 100

      - name: Commit updated JSON data
        run: |
          git config user.name "jiushu-bot"
          git config user.email "bot@jiushu.tw"
          git add data/daily_tenders.json data/archive/
          git diff --staged --quiet || git commit -m "chore: update daily tenders $(TZ=Asia/Taipei date +%F)"
          git push
